<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · CodeNow</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/skins.css">
<script src="assets/i18n.js"></script>
<script src="assets/chrome.js"></script>
<style>
  .auth-page { display: flex; align-items: center; justify-content: center; padding: var(--sp-10) var(--sp-6); }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-card .cn-card__body { padding: var(--sp-8); }
  .auth-check { display: flex; align-items: flex-start; gap: var(--sp-2); font-size: var(--text-caption); color: var(--text-secondary); cursor: pointer; }
  .auth-check input { accent-color: var(--brand); margin-top: var(--sp-1); }
  .auth-check a { color: var(--brand-text); font-weight: var(--weight-medium); }
  .auth-check a:hover { text-decoration: underline; }
  .auth-note { text-align: center; }
  .auth-note a { color: var(--brand-text); font-weight: var(--weight-medium); }
  .auth-note a:hover { text-decoration: underline; }
</style>
</head>
<body data-chrome="auth" data-page="auth">
<div data-chrome="header"></div>

<main class="auth-page">
  <div class="cn-card auth-card">
    <div class="cn-card__body">
      <a class="cn-logo" href="index.html" aria-label="CodeNow" data-logo></a>

      <h1 class="u-h1 u-mt-6" data-i18n="rg.title"></h1>
      <p class="u-caption u-mt-4" data-i18n="rg.sub"></p>

      <div class="u-col u-gap-4 u-mt-6">
        <div class="cn-field">
          <label data-i18n="rg.account"></label>
          <input class="cn-input" data-i18n-ph="rg.phAccount">
        </div>
        <div class="cn-field">
          <label data-i18n="rg.password"></label>
          <input class="cn-input" type="password" data-i18n-ph="rg.phPassword">
        </div>
        <div class="cn-field">
          <label data-i18n="rg.confirm"></label>
          <input class="cn-input" type="password" data-i18n-ph="rg.phConfirm">
        </div>
        <div class="cn-field">
          <label data-i18n="rg.code"></label>
          <div class="u-row u-gap-3">
            <input class="cn-input u-grow" data-i18n-ph="rg.phCode">
            <button class="cn-btn cn-btn--ghost" type="button" data-i18n="rg.getCode"></button>
          </div>
        </div>
        <label class="auth-check">
          <input type="checkbox">
          <span><span data-i18n="rg.agree"></span> <a href="#" data-i18n="rg.terms"></a> · <a href="#" data-i18n="rg.privacy"></a></span>
        </label>
        <button class="cn-btn cn-btn--primary cn-btn--block cn-btn--lg" data-i18n="rg.signup"></button>
      </div>

      <p class="u-caption auth-note u-mt-6">
        <span data-i18n="rg.haveAccount"></span>
        <a href="login.html" data-i18n="rg.login"></a>
      </p>
    </div>
  </div>
</main>

<div data-chrome="footer"></div>

<script>
I18N.define({
  'rg.title': '注册 CodeNow',
  'rg.sub': '创建账号，用一句话生成你的第一个应用。',
  'rg.account': '账号',
  'rg.phAccount': '请输入账号',
  'rg.password': '密码',
  'rg.phPassword': '至少 8 位，含字母与数字',
  'rg.confirm': '确认密码',
  'rg.phConfirm': '请再次输入密码',
  'rg.code': '验证码',
  'rg.phCode': '请输入验证码',
  'rg.getCode': '获取验证码',
  'rg.agree': '我已阅读并同意',
  'rg.terms': '服务条款',
  'rg.privacy': '隐私政策',
  'rg.signup': '注册',
  'rg.haveAccount': '已有账号？',
  'rg.login': '登录'
}, {
  'rg.title': 'Create your CodeNow account',
  'rg.sub': 'Sign up and generate your first app from one sentence.',
  'rg.account': 'Account',
  'rg.phAccount': 'Enter your account',
  'rg.password': 'Password',
  'rg.phPassword': 'At least 8 chars, letters and digits',
  'rg.confirm': 'Confirm password',
  'rg.phConfirm': 'Re-enter your password',
  'rg.code': 'Verification code',
  'rg.phCode': 'Enter the code',
  'rg.getCode': 'Get code',
  'rg.agree': 'I have read and agree to',
  'rg.terms': 'Terms of Service',
  'rg.privacy': 'Privacy Policy',
  'rg.signup': 'Sign up',
  'rg.haveAccount': 'Already have an account?',
  'rg.login': 'Sign in'
});
</script>
</body>
</html>

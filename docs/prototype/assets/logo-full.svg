<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 120" width="548" height="120" role="img" aria-label="CodeNow">
  <defs>
    <linearGradient id="cnTealF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47E0D6"/>
      <stop offset="1" stop-color="#12A2C2"/>
    </linearGradient>
    <linearGradient id="cnBoltF" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#58A9F8"/>
      <stop offset="1" stop-color="#2450D8"/>
    </linearGradient>
  </defs>

  <!-- 图标 -->
  <g>
    <circle cx="40" cy="62" r="12" fill="none" stroke="url(#cnTealF)" stroke-width="10"/>
    <ellipse cx="40" cy="62" rx="28" ry="9" transform="rotate(-25 40 62)" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
    <path d="M14 50 V37 L60 10 L106 37 V50" fill="none" stroke="#1E2A6E" stroke-width="13" stroke-linejoin="round"/>
    <path d="M106 68 V83 L60 110 L14 83 V68" fill="none" stroke="#1E2A6E" stroke-width="13" stroke-linejoin="round"/>
    <path d="M64 35 L76 29 L86 60 L86 28 L100 21 L88 54 L96 54 L76 98 L70 58 L70 91 L54 91 Z" fill="url(#cnBoltF)"/>
    <path d="M4 55 H21 M9 64 H21" fill="none" stroke="url(#cnTealF)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- 字标 CodeNow（圆头笔画构建；o = 星环，N = 闪电） -->
  <g fill="none" stroke="#1E2A6E" stroke-width="16" stroke-linecap="round">
    <!-- C（大写字高） -->
    <path d="M175.3 49.9 A21.5 21.5 0 1 0 175.3 85.1"/>
    <!-- d -->
    <circle cx="265" cy="72" r="17"/>
    <path d="M282 22 V97"/>
    <!-- e -->
    <path d="M302 72 H336"/>
    <path d="M336 72 A17 17 0 1 0 328.5 85.5"/>
    <!-- o -->
    <circle cx="438" cy="72" r="17"/>
    <!-- w -->
    <path d="M475 53 L487 91 L502 58 L517 91 L529 53" stroke-linejoin="round"/>
  </g>
  <!-- o（星环版本） -->
  <circle cx="215" cy="72" r="17" fill="none" stroke="url(#cnTealF)" stroke-width="14"/>
  <ellipse cx="215" cy="72" rx="26" ry="8" transform="rotate(-22 215 72)" fill="none" stroke="#E9FBFD" stroke-width="3.5"/>
  <!-- N（闪电版本） -->
  <g transform="translate(290.3,-8.8) scale(1.18)">
    <path d="M64 35 L76 29 L86 60 L86 28 L100 21 L88 54 L96 54 L76 98 L70 58 L70 91 L54 91 Z" fill="url(#cnBoltF)"/>
  </g>
</svg>

spring:
  application:
    name: ice-ai-code-mother-backend
  profiles:
    active: local
  # 异步请求超时（SSE 流式接口：AI 生成流、Vue 构建进度流）
  mvc:
    async:
      request-timeout: 600000
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.iceblyte.aicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

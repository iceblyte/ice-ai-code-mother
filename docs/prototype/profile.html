(function () {
  var seg = document.querySelector('.pf-seg');
  if (seg) {
    seg.addEventListener('click', function (e) {
      var b = e.target.closest('button[data-view]');
      if (!b) return;
      seg.querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-selected', String(x === b));
      });
      var v = b.getAttribute('data-view');
      document.getElementById('viewCards').hidden = v !== 'cards';
      document.getElementById('viewList').hidden = v !== 'list';
    });
  }

  var filters = document.querySelector('.pf-filters');
  if (filters) {
    filters.addEventListener('click', function (e) {
      var b = e.target.closest('.cn-filter');
      if (!b) return;
      filters.querySelectorAll('.cn-filter').forEach(function (x) {
        x.setAttribute('aria-pressed', String(x === b));
      });
    });
  }
})();
</script>

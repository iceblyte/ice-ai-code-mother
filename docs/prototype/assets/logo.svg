<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="CodeNow">
  <defs>
    <linearGradient id="cnNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B3A8E"/>
      <stop offset="1" stop-color="#151F55"/>
    </linearGradient>
    <linearGradient id="cnTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#47E0D6"/>
      <stop offset="1" stop-color="#12A2C2"/>
    </linearGradient>
    <linearGradient id="cnBolt" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#58A9F8"/>
      <stop offset="1" stop-color="#2450D8"/>
    </linearGradient>
  </defs>
  <!-- 星环 O -->
  <circle cx="40" cy="62" r="12" fill="none" stroke="url(#cnTeal)" stroke-width="10"/>
  <!-- 白色轨道弧线（两端隐入括号与字母之后） -->
  <ellipse cx="40" cy="62" rx="28" ry="9" transform="rotate(-25 40 62)" fill="none" stroke="#FFFFFF" stroke-width="4.5"/>
  <!-- 六边形代码括号（上下两段，左右开口） -->
  <path d="M14 50 V37 L60 10 L106 37 V50" fill="none" stroke="url(#cnNavy)" stroke-width="13" stroke-linejoin="round"/>
  <path d="M106 68 V83 L60 110 L14 83 V68" fill="none" stroke="url(#cnNavy)" stroke-width="13" stroke-linejoin="round"/>
  <!-- 闪电 N -->
  <path d="M64 35 L76 29 L86 60 L86 28 L100 21 L88 54 L96 54 L76 98 L70 58 L70 91 L54 91 Z" fill="url(#cnBolt)"/>
  <!-- 速度线 -->
  <path d="M4 55 H21 M9 64 H21" fill="none" stroke="url(#cnTeal)" stroke-width="4.5" stroke-linecap="round"/>
</svg>

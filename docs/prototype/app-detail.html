<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">

<style>
  .dt-page { padding: var(--sp-8) 0 var(--sp-8); }
  .dt-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); font-size: var(--text-caption); color: var(--text-muted); }
  .dt-crumb a:hover { color: var(--text-primary); }
  .dt-crumb__sep { color: var(--border-strong); }
  .dt-head { margin-top: var(--sp-5); }
  .dt-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-4); margin-top: var(--sp-4); font-size: var(--text-caption); color: var(--text-muted); }
  .dt-meta__pair { display: inline-flex; align-items: center; gap: var(--sp-2); }
  .dt-actions { display: flex; flex-wrap: wrap; gap: var(--sp-3); margin-top: var(--sp-5); }
  .dt-body { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr); gap: var(--sp-6); align-items: start; margin-top: var(--sp-7); }
  .dt-browser { border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; background: var(--bg-surface); }
  .dt-browser__bar { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); background: var(--bg-surface-muted); }
  .dt-browser__dots { display: flex; gap: 6px; }
  .dt-browser__dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); }
  .dt-browser__dots i:first-child { background: var(--brand); }
  .dt-browser__url { flex: 1 1 auto; display: flex; align-items: center; height: 26px; padding: 0 var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius-full); background: var(--bg-surface); color: var(--text-muted); font-size: var(--text-micro); }
  .dt-browser .cn-cover { border-bottom: 0; }
  .dt-info__row { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-3) 0; border-bottom: 1px solid var(--border); font-size: var(--text-caption); }
  .dt-info__row:last-child { border-bottom: 0; padding-bottom: 0; }
  .dt-info__row > span:first-child { color: var(--text-muted); }
  .dt-section { margin-top: var(--sp-9); }
  .dt-chat { display: flex; flex-direction: column; gap: var(--sp-5); max-width: 760px; }
  @media (max-width: 860px) { .dt-body { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body data-chrome="app" data-page="explore">
<div data-chrome="header"></div>

<main class="u-container dt-page">

  <nav class="dt-crumb">

  <header class="dt-head">

  <div class="dt-body">

    </aside>

  <section class="dt-section">

      </div>

        <div class="cn-msg__bubble u-mono" data-i18n="dt.m3"></div>
      </div>
    </div>
  </section>

  <section class="dt-section">
    <div class="u-section-head">

    </div>
    <div class="cn-grid cn-grid--4">

        <div class="cn-cover"><div class="cn-cover__grid"></div><div class="cn-cover__dots"><i></i><i></i><i></i></div>
          <div class="cn-cover__wire"><span></span><span></span><span></span></div><span class="cn-cover__mark">#1980</span></div>

      <a class="cn-card cn-card--hover cn-appcard" href="app-detail.html">
        <div class="cn-cover"><div class="cn-cover__grid"></div><div class="cn-cover__dots"><i></i><i></i><i></i></div>
          <div class="cn-cover__wire"><span></span><span></span><span></span></div><span class="cn-cover__mark">#1974</span></div>
        <div class="cn-appcard__body">
          <h3 class="cn-appcard__title u-truncate" data-i18n="dt.r2"></h3>
          <div class="cn-appcard__meta"><span class="cn-tag u-mono" data-i18n="type.vue"></span><span>Mia</span>

      <a class="cn-card cn-card--hover cn-appcard" href="app-detail.html">
        <div class="cn-cover"><div class="cn-cover__grid"></div><div class="cn-cover__dots"><i></i><i></i><i></i></div>
          <div class="cn-cover__wire"><span></span><span></span><span></span></div><span class="cn-cover__mark">#1961</span></div>

          <h3 class="cn-appcard__title u-truncate" data-i18n="dt.r3"></h3>
          <div class="cn-appcard__meta"><span class="cn-tag u-mono" data-i18n="type.game"></span><span>Zoey</span>
            <span class="u-grow"></span><span class="cn-appcard__stats">742</span></div>
        </div>

      <a class="cn-card cn-card--hover cn-appcard" href="app-detail.html">
        <div class="cn-cover"><div class="cn-cover__grid"></div><div class="cn-cover__dots"><i></i><i></i><i></i></div>
          <div class="cn-cover__wire"><span></span><span></span><span></span></div><span class="cn-cover__mark">#1902</span></div>
        <div class="cn-appcard__body">
          <h3 class="cn-appcard__title u-truncate" data-i18n="dt.r4"></h3>
          <div class="cn-appcard__meta"><span class="cn-tag u-mono" data-i18n="type.vue"></span><span>Kai</span>
            <span class="u-grow"></span><span class="cn-appcard__stats">530</span></div>
        </div>

    </div>
  </section>

</main>

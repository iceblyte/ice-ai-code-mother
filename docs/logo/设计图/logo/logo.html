<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logo SVG</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #fff;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .logo {
        display: block;
        width: min(100%, 760px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <svg
      class="logo"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 542 398"
      role="img"
      aria-labelledby="logo-title"
    >
      <title id="logo-title">Logo</title>

      <defs>
        <linearGradient id="navy" x1="0" y1="0" x2=".9" y2="1">
          <stop offset="0" stop-color="#173b83" />
          <stop offset=".48" stop-color="#102d70" />
          <stop offset="1" stop-color="#071b4a" />
        </linearGradient>

        <linearGradient id="blue" x1=".05" y1=".05" x2=".88" y2=".92">
          <stop offset="0" stop-color="#1458f5" />
          <stop offset=".48" stop-color="#0873ff" />
          <stop offset="1" stop-color="#0046d5" />
        </linearGradient>

        <linearGradient id="teal" x1=".08" y1=".15" x2=".86" y2=".9">
          <stop offset="0" stop-color="#00c9c6" />
          <stop offset=".46" stop-color="#00b9b6" />
          <stop offset=".76" stop-color="#27e0d0" />
          <stop offset="1" stop-color="#00a7b2" />
        </linearGradient>

        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="blur" />
          <feOffset in="blur" dy="1" result="offset" />
          <feComponentTransfer in="offset" result="shadow">
            <feFuncA type="linear" slope=".16" />
          </feComponentTransfer>
          <feMerge>
            <feMergeNode in="shadow" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
      </defs>

      <rect width="542" height="398" fill="#fff" />

      <!-- 上方深蓝色弧形框架 -->
      <path
        filter="url(#shadow)"
        fill="url(#navy)"
        d="M188 154
       C178 155 173 145 177 134
       C180 125 190 119 201 113
       L258 77
       C274 67 285 63 298 67
       C310 70 323 78 337 88
       L389 124
       C397 129 399 136 392 142
       L371 148
       C365 151 359 150 352 145
       L299 113
       C291 108 284 109 276 114
       L221 148
       C210 154 200 151 188 154 Z"
      />

      <!-- 下方深蓝色弧形框架 -->
      <path
        filter="url(#shadow)"
        fill="url(#navy)"
        d="M193 278
       C204 276 214 274 223 274
       C232 274 239 279 247 284
       L277 301
       C285 306 293 306 301 302
       L379 260
       C390 253 399 253 403 262
       C407 272 402 280 393 286
       L321 339
       C307 349 294 352 281 348
       C267 344 255 337 242 329
       L190 297
       C181 292 179 284 186 280
       C188 279 190 278 193 278 Z"
      />

      <!-- 字母 o：完整饱满的青色圆轮廓，内部圆角菱形负空间 -->
      <path
        fill="url(#teal)"
        fill-rule="evenodd"
        d="M155 211
       a44 44 0 1 0 88 0
       a44 44 0 1 0 -88 0
       Z
       M193.3 190.7
       Q199 185 204.7 190.7
       L219.3 205.3
       Q225 211 219.3 216.7
       L204.7 231.3
       Q199 237 193.3 231.3
       L178.7 216.7
       Q173 211 178.7 205.3
       Z"
      />

      <!-- 右侧蓝色锐角飞翼标志 -->
      <path
        fill="url(#blue)"
        d="M244 259
       L295 162
       C297 158 300 156 305 156
       L327 155
       C331 155 333 158 333 162
       L339 199
       L431 136
       C437 132 440 132 437 137
       L351 256
       C347 261 343 263 337 262
       L315 262
       C311 262 309 260 308 256
       L302 220
       L249 260
       C245 263 242 263 244 259 Z"
      />

      <!-- 细微高光 -->
      <path
        fill="none"
        stroke="#3762a5"
        stroke-opacity=".18"
        stroke-width="2"
        d="M188 154
       C178 155 173 145 177 134
       C180 125 190 119 201 113"
      />

      <path
        fill="none"
        stroke="#3a5594"
        stroke-opacity=".2"
        stroke-width="2"
        d="M194 282 C207 283 218 286 230 294"
      />
    </svg>
  </body>
</html>

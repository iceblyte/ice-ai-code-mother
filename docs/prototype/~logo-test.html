<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>logo reproduction check</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  .row { display: flex; align-items: center; gap: 32px; padding: 24px 32px; flex-wrap: wrap; }
  .dark { background: #14161d; color: #eee; }
  .light { background: #ffffff; color: #111; }
  .lbl { font-size: 12px; opacity: .55; width: 130px; }
  .cell { display: flex; align-items: center; gap: 16px; }
  img.ref { max-width: 720px; width: 100%; display: block; }
  svg { display: block; }
</style>
</head>
<body>

<div class="row light">
  <span class="lbl">原图（用户设计）</span>
  <img class="ref" src="~logo-ref.png" alt="ref">
</div>

<div class="row light">
  <span class="lbl">复现 · 横版组合</span>
  <img src="assets/logo-full.svg" width="480" alt="lockup" style="max-width:100%;height:auto">
</div>

<div class="row light">
  <span class="lbl">复现 · 图标 112/26/20</span>
  <span class="cell">
    <img src="assets/logo.svg" width="112" height="112" alt="icon112">
    <img src="assets/logo.svg" width="26" height="26" alt="icon26">
    <img src="assets/logo.svg" width="20" height="20" alt="icon20">
  </span>
</div>

<div class="row light">
  <span class="lbl">复现 · favicon</span>
  <span class="cell">
    <img src="assets/favicon.svg" width="32" height="32" alt="favicon">
    <span style="background:#323639;border-radius:8px;padding:6px;display:inline-flex"><img src="assets/favicon.svg" width="32" height="32" alt="favicon dark"></span>
  </span>
</div>

<div class="row dark">
  <span class="lbl">dark · 图标 112/26/20</span>
  <span class="cell">
    <img src="assets/logo.svg" width="112" height="112" alt="icon112d">
    <img src="assets/logo.svg" width="26" height="26" alt="icon26d">
    <img src="assets/logo.svg" width="20" height="20" alt="icon20d">
  </span>
</div>

</body>
</html>
